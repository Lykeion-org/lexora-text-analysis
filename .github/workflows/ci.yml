name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.8
      - name: Lint (syntax errors and undefined names)
        run: ruff check --isolated --select E9,F63,F7,F82 --output-format github .
      - name: Byte-compile
        run: python -m compileall -q src
